<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05060d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Wall Glider</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="score">0</div>
      <div id="best"></div>
      <div id="readout" hidden></div>
      <button id="exit" type="button" hidden>&larr; Menu</button>
      <div id="corner">
        <button id="aids" type="button" aria-expanded="false" aria-controls="aids-panel">Aids</button>
        <button id="quality" type="button" aria-label="Toggle graphics quality">HI</button>
      </div>
      <div id="aids-panel" hidden>
        <p class="panel-title">In world</p>
        <label><input type="checkbox" id="aid-shadow" /> <span>Shadow on wall</span></label>
        <div class="slider">
          <label for="aid-shadow-distance">Appears <output id="aid-shadow-distance-value">20</output> from wall</label>
          <input type="range" id="aid-shadow-distance" step="1" />
        </div>
        <label><input type="checkbox" id="aid-rim" /> <span>Rim warning</span></label>
        <label><input type="checkbox" id="aid-arcs" /> <span>Electric arcs</span></label>
        <label><input type="checkbox" id="aid-headlight" /> <span>Headlight</span></label>
        <label><input type="checkbox" id="aid-heat" /> <span>Wall heat glow</span></label>
        <label><input type="checkbox" id="aid-dust" /> <span>Bow-wave dust</span></label>
        <p class="panel-title">Interface</p>
        <label><input type="checkbox" id="aid-markers" /> <span>Target markers</span></label>
        <p class="panel-title">Rules</p>
        <label><input type="checkbox" id="aid-forgiving" /> <span>Forgiving hitbox</span></label>
      </div>
    </div>
    <div id="overlay" class="visible">
      <h1>WALL GLIDER</h1>
      <p id="overlay-sub">Drag to steer. Fly through the gaps.</p>
      <p id="overlay-cta" class="pulse">Tap to start</p>
      <div id="modes">
        <button id="mode-tunnel" type="button">Tunnel</button>
        <button id="mode-free" type="button">Free flight</button>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
